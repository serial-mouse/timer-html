<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多功能时钟计时器（带提示音开关）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}
body{
  min-height:100vh;
  background:#12121a;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  padding:20px;
  transition: box-shadow 0.2s;
}
body.flash{
  animation: flashBorder 0.4s infinite;
}
@keyframes flashBorder{
  0%{box-shadow: inset 0 0 0 8px #ff3b3b}
  50%{box-shadow: inset 0 0 0 8px transparent}
  100%{box-shadow: inset 0 0 0 8px #ff3b3b}
}
.digital-info{
  text-align:center;
}
.digital-time{
  font-size:48px;
  font-family:monospace;
  color:#63a4ff;
  letter-spacing:4px;
}
.digital-date{
  font-size:20px;
  color:#b8b8d8;
  margin-top:6px;
}
.wrap{
  display:flex;
  flex-wrap:wrap;
  gap:40px;
  align-items:center;
  justify-content:center;
}
.clock{
  width:320px;
  height:320px;
  border-radius:50%;
  background:#1e1e2f;
  border:4px solid #383858;
  position:relative;
  box-shadow: 0 0 30px #0005;
}
.clock-face{
  width:100%;
  height:100%;
  position:relative;
}
.clock .num{
  position:absolute;
  width:100%;
  height:100%;
  text-align:center;
  padding:12px;
  font-size:18px;
  color:#b8b8d8;
}
.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin: bottom center;
  border-radius:4px;
}
.hour{
  width:8px;
  height:80px;
  background:#63a4ff;
  margin-left:-4px;
}
.minute{
  width:5px;
  height:110px;
  background:#42e2b8;
  margin-left:-2.5px;
}
.second{
  width:2px;
  height:130px;
  background:#ff5777;
  margin-left:-1px;
}
.center{
  width:14px;
  height:14px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:10;
}
.timer-panel{
  background:#1e1e2f;
  padding:28px;
  border-radius:16px;
  min-width:340px;
  box-shadow:0 0 25px #0004;
}
.title{
  text-align:center;
  font-size:24px;
  margin-bottom:20px;
  color:#e0e8ff;
}
.time-show{
  font-size:52px;
  text-align:center;
  font-family:monospace;
  margin:16px 0;
  color:#fff;
  letter-spacing:3px;
}
.row{
  display:flex;
  gap:10px;
  margin:12px 0;
  flex-wrap:wrap;
  justify-content:center;
}
input{
  width:72px;
  padding:10px;
  border:none;
  border-radius:8px;
  text-align:center;
  font-size:18px;
  background:#2c2c44;
  color:#fff;
  outline:none;
}
input:focus{
  border:1px solid #63a4ff;
}
button{
  padding:11px 18px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}
.btn-start{background:#28a745;color:#fff}
.btn-stop{background:#dc3545;color:#fff}
.btn-reset{background:#6c757d;color:#fff}
button:hover{filter:brightness(1.15)}
.radio-wrap{
  display:flex;
  gap:20px;
  justify-content:center;
  margin:14px 0;
}
.radio-wrap label{
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}
.audio-switch-wrap{
  display:flex;
  justify-content:center;
  margin:12px 0;
  gap:8px;
}
.audio-switch-wrap label{
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}
</style>
</head>
<body>
<div class="digital-info">
  <div class="digital-time" id="digitalTime">00:00:00</div>
  <div class="digital-date" id="digitalDate">2025-01-01 星期三</div>
</div>

<div class="wrap">
  <div class="clock">
    <div class="clock-face">
      <div class="num" style="transform:rotate(30deg)">1</div>
      <div class="num" style="transform:rotate(60deg)">2</div>
      <div class="num" style="transform:rotate(90deg)">3</div>
      <div class="num" style="transform:rotate(120deg)">4</div>
      <div class="num" style="transform:rotate(150deg)">5</div>
      <div class="num" style="transform:rotate(180deg)">6</div>
      <div class="num" style="transform:rotate(210deg)">7</div>
      <div class="num" style="transform:rotate(240deg)">8</div>
      <div class="num" style="transform:rotate(270deg)">9</div>
      <div class="num" style="transform:rotate(300deg)">10</div>
      <div class="num" style="transform:rotate(330deg)">11</div>
      <div class="num" style="transform:rotate(360deg)">12</div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minHand"></div>
      <div class="hand second" id="secHand"></div>
      <div class="center"></div>
    </div>
  </div>

  <div class="timer-panel">
    <div class="title">计时器</div>
    <div class="radio-wrap">
      <label><input type="radio" name="mode" value="countdown" checked> 倒计时</label>
      <label><input type="radio" name="mode" value="countup"> 正向计时</label>
    </div>
    <!-- 提示音开关，默认开启 -->
    <div class="audio-switch-wrap">
      <label><input type="checkbox" id="beepSwitch" checked> 结束提示音(浏览器限制: 第一次播放声音必须由用户交互触发,请先触发一次)</label>
    </div>
    <div class="row">
      <input type="number" id="h" min="0" max="99" value="0" placeholder="时">
      <input type="number" id="m" min="0" max="59" value="0" placeholder="分">
      <input type="number" id="s" min="0" max="59" value="10" placeholder="秒">
    </div>
    <div class="time-show" id="timeDisplay">00:00:10</div>
    <div class="row">
      <button class="btn-start" id="startBtn">开始</button>
      <button class="btn-stop" id="stopBtn">暂停</button>
      <button class="btn-reset" id="resetBtn">重置</button>
    </div>
  </div>
</div>

<script>
// 表盘 + 数字日期时间
const hourHand = document.getElementById('hourHand');
const minHand = document.getElementById('minHand');
const secHand = document.getElementById('secHand');
const digitalTime = document.getElementById('digitalTime');
const digitalDate = document.getElementById('digitalDate');
const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function updateClock(){
  const now = new Date();
  const h = now.getHours() % 12;
  const h24 = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ms = now.getMilliseconds();

  let secDeg = s * 6 + ms * 0.006;
  let minDeg = m * 6 + s * 0.1;
  let hourDeg = h * 30 + m * 0.5;
  secHand.style.transform = `rotate(${secDeg}deg)`;
  minHand.style.transform = `rotate(${minDeg}deg)`;
  hourHand.style.transform = `rotate(${hourDeg}deg)`;

  const strH = String(h24).padStart(2,'0');
  const strM = String(m).padStart(2,'0');
  const strS = String(s).padStart(2,'0');
  digitalTime.innerText = `${strH}:${strM}:${strS}`;

  const y = now.getFullYear();
  const mo = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const week = weekArr[now.getDay()];
  digitalDate.innerText = `${y}-${mo}-${d} ${week}`;
}
setInterval(updateClock, 50);
updateClock();

// ========== 计时器（分段暂停记录 + WebAudio蜂鸣提示音） ==========
const timeDisplay = document.getElementById('timeDisplay');
const hInput = document.getElementById('h');
const mInput = document.getElementById('m');
const sInput = document.getElementById('s');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const resetBtn = document.getElementById('resetBtn');
const beepSwitch = document.getElementById('beepSwitch');
const body = document.body;

let timerId = null;
let isCountDown = true;
let totalTargetSec = 0;
let globalStartTs = null;
let finished = false;
let audioCtx = null;
let beepPlaying = false;

// 二维列表：[[pauseTs, resumeTs], [pauseTs, resumeTs], ...]
let segments = [];

function formatTime(sec){
  sec = Math.max(0, Math.floor(sec));
  let h = Math.floor(sec / 3600);
  let m = Math.floor((sec % 3600) / 60);
  let s = sec % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function readInput(){
  let h = Number(hInput.value)||0;
  let m = Number(mInput.value)||0;
  let s = Number(sInput.value)||0;
  return h*3600 + m*60 + s;
}

function getTotalPauseSeconds(){
  let sum = 0;
  for(let seg of segments){
    const [p, r] = seg;
    if(r === -1) continue;
    sum += (r - p) / 1000;
  }
  return sum;
}

// 蜂鸣播放逻辑：每组3滴，滴间隔0.2s；组间隔0.5s；一共循环6组
async function playBeepSequence(){
  if(beepPlaying) return;
  beepPlaying = true;
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const freq = 880;
  const beepDuration = 0.12;
  const dotGap = 0.2;
  const groupGap = 0.5;
  const groupCount = 6;

  for(let g = 0; g < groupCount; g++){
    for(let d = 0; d < 3; d++){
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.value = 0.2;
      const t = audioCtx.currentTime;
      osc.start(t);
      osc.stop(t + beepDuration);
      await sleep(dotGap * 1000);
    }
    await sleep(groupGap * 1000);
  }
  beepPlaying = false;
}
function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function tick(){
  const nowTs = Date.now();
  const pauseTotalSec = getTotalPauseSeconds();
  const elapsedSec = (nowTs - globalStartTs)/1000 - pauseTotalSec;

  if(isCountDown){
    const remainSec = totalTargetSec - elapsedSec;
    if(remainSec <= 0){
      timeDisplay.textContent = formatTime(0);
      if(!finished){
        finished = true;
        triggerAlert();
      }
      pauseTimer();
      return;
    }
    timeDisplay.textContent = formatTime(remainSec);
  }else{
    timeDisplay.textContent = formatTime(elapsedSec);
  }
}

function startTimer(){
  if(timerId) return;
  finished = false;
  const nowTs = Date.now();

  if(globalStartTs === null){
    totalTargetSec = readInput();
    globalStartTs = nowTs;
  }else{
    if(segments.length > 0){
      const last = segments[segments.length - 1];
      if(last[1] === -1){
        last[1] = nowTs;
      }
    }
  }
  timerId = setInterval(tick, 1000);
}

function pauseTimer(){
  if(!timerId) return;
  clearInterval(timerId);
  timerId = null;
  const nowTs = Date.now();
  segments.push([nowTs, -1]);
}

function resetTimer(){
  pauseTimer();
  body.classList.remove('flash');
  globalStartTs = null;
  segments = [];
  finished = false;
  timeDisplay.textContent = formatTime(readInput());
}

function triggerAlert(){
  body.classList.add('flash');
  setTimeout(()=>body.classList.remove('flash'),5000);
  if(beepSwitch.checked){
    playBeepSequence();
  }
}

document.querySelectorAll('input[name=mode]').forEach(radio=>{
  radio.onchange = ()=>{
    isCountDown = radio.value === 'countdown';
    resetTimer();
  }
})

startBtn.onclick = startTimer;
stopBtn.onclick = pauseTimer;
resetBtn.onclick = resetTimer;
resetTimer();
</script>
</body>
</html>
